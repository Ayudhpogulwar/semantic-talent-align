services:
  - type: web
    name: saiotaf-backend
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn --chdir student-dashboard/backend config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: USE_SQLITE
        value: "true"
